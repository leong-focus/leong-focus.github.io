function image(src, alt) {

  element.src = src;
  element.alt = alt;

const hollows = steps.map(step => {

});
const pieces = fragments.map((piece,index) => {

});
const clods = steps.map((step,index) => {

  target.hidden = hud.hidden = true;

  const floatingPositions = [
    {x:50,y:49,w:19,angle:-10},
    {x:31,y:38,w:5.1,angle:-25},
    {x:68,y:34,w:6.1,angle:19},
    {x:74,y:55,w:4.7,angle:32},
    {x:27,y:61,w:6.6,angle:-22},
    {x:57,y:75,w:6.9,angle:8}

const film = $('.film-intro');

const skip = $('.film-skip');

const caption = $('.film-caption');
const captions = [
  [1.84, 3.1667, '“云雾散开，浙南的群山渐渐显露。”'],
  [3.1667, 5.75, '“翻过山岭，龙泉小梅镇坐落在此。”'],
  [5.75, 7.9583, '“山坳之间，青瓦错落，这就是大窑村。”'],
  [7.9583, 10.5, '“大窑的窑火，曾把一抹青色烧进瓷里。”']

function updateCaption() {

video.addEventListener('seeking', updateSkip);
skip.addEventListener('click', enterExcavation);
video.addEventListener('error', enterExcavation);
video.play().catch(enterExcavation);
</script>
