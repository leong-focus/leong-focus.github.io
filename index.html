<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>瓷光重现</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #211b16;
    }

    #experience {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      border: 0;
    }

    @media (orientation: portrait) and (any-pointer: coarse) {
      #experience {
        /* Give each chapter landscape dimensions and rotate its viewport as one unit. */
        left: 100%;
        width: 100vh;
        height: 100vw;
        width: 100dvh;
        height: 100dvw;
        transform-origin: top left;
        transform: rotate(90deg);
      }
    }
  </style>
  <script>
    window.addEventListener('message', (event) => {
      const chapter = document.getElementById('experience');
      if (event.origin !== location.origin || event.source !== chapter?.contentWindow) return;
      if (event.data?.type === 'celadon:repair-ready') {
        event.source.postMessage({ type: 'celadon:host-visibility', visible: true }, location.origin);
      }
    });
  </script>
</head>
<body>
  <iframe id="experience" title="瓷光重现互动体验" src="/start/" allow="autoplay; fullscreen" allowfullscreen></iframe>
</body>
</html>
